# cordis.yml 的无密钥回放版本：保留常规 headless 配置、启用 Qwen 语音，
# 并用回放模型替换在线模型。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: speech-generation-qwen
  name: '@deepseek-ai/dsh-speech-generation-qwen'
  config:
    enabled: true

- id: image-generation-evolink
  name: '@deepseek-ai/dsh-image-generation-evolink'
  config:
    enabled: false

- id: hyperframes-tools
  name: '@deepseek-ai/dsh-hyperframes-tools'
  config:
    enabled: false

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
