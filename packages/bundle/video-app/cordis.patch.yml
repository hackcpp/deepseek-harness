# Video-production layer applied after dsh-web-app.

- id: agent-presets
  config:
    default: video

- insert:
    - id: speech-generation-qwen
      name: '@deepseek-ai/dsh-speech-generation-qwen'
      config:
        enabled: true
        apiKeyEnv: DASHSCOPE_API_KEY

    - id: image-generation-evolink
      name: '@deepseek-ai/dsh-image-generation-evolink'
      config:
        enabled: true
        apiKeyEnv: EVOLINK_API_KEY

    - id: hyperframes-tools
      name: '@deepseek-ai/dsh-hyperframes-tools'
      config:
        enabled: true

    - id: ui-video
      name: '@deepseek-ai/dsh-client-ui-video'
      config:
        projectsRoot: !!js process.env.DSH_VIDEO_PROJECTS_ROOT ?? process.cwd()
        scanDepth: 2
